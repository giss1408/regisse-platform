# Prometheus-format alert rules for Grafana Cloud (Mimir ruler). Load with:
#   mimirtool rules load --address=<ruler url> --id=<instance id> --key=<token> monitoring/alerts.yaml
# Contact point: create a Telegram contact point in Grafana Cloud (Alerting > Contact points) and route severity=~"page|warn" to it.
groups:
  - name: platform-availability
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 3m
        labels: {severity: page}
        annotations: {summary: "{{ $labels.job }} is not answering its metrics scrape"}
      - alert: HighServerErrorRate
        expr: sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: page}
        annotations: {summary: "{{ $labels.service }}: more than 5% of requests fail with 5xx"}
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels: {severity: warn}
        annotations: {summary: "{{ $labels.service }}: p95 latency above 1.5 s"}
  - name: platform-infra
    rules:
      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{mountpoint="/host"} / node_filesystem_size_bytes{mountpoint="/host"}) < 0.15
        for: 10m
        labels: {severity: page}
        annotations: {summary: "Less than 15% disk left"}
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: {severity: warn}
        annotations: {summary: "Less than 10% memory available"}
      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total[10m]) > 0
        labels: {severity: page}
        annotations: {summary: "A container was OOM-killed: {{ $labels.name }}"}
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "Postgres connections above 80% of max"}
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels: {severity: page}
        annotations: {summary: "Redis above 85% of maxmemory (policy is noeviction: writes will start failing, and auth fails closed)"}
  - name: platform-security
    rules:
      - alert: LoginFailureSpike
        expr: sum(rate(security_events_total{event="401_invalid_credentials"}[5m])) > 1
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "Sustained failed logins (possible credential stuffing)"}
      - alert: RefreshTokenReuse
        expr: increase(security_events_total{event="refresh_reuse"}[15m]) > 0
        labels: {severity: warn}
        annotations: {summary: "A rotated refresh token was replayed: a session may be stolen"}
      - alert: RateLimitingActive
        expr: sum(increase(security_events_total{event=~"429_.*"}[10m])) > 50
        labels: {severity: warn}
        annotations: {summary: "Many rate-limit or lockout answers in 10 min"}
      - alert: RelayVolumeUnusual
        expr: increase(security_events_total{event="relay_sent"}[1h]) > 40
        labels: {severity: warn}
        annotations: {summary: "More than 40 WhatsApp relay codes sent in an hour (admin abuse or an attack on sign-up)"}
      - alert: AuthForbiddenSpike
        expr: sum(increase(security_events_total{event=~"403_.*"}[10m])) > 30
        labels: {severity: warn}
        annotations: {summary: "Many 403 answers: probing of admin endpoints"}
  - name: fidelia-security
    rules:
      - alert: FideliaWrongCodeSpike
        expr: sum(rate(fidelia_auth_events_total{event="otp_verify",result="wrong_code"}[5m])) > 0.5
        for: 5m
        labels: {severity: warn}
        annotations: {summary: "Fidelia: sustained wrong sign-in codes (guessing attack)"}
      - alert: FideliaSmsBudgetHit
        expr: increase(fidelia_auth_events_total{event="otp_request",result="daily_budget"}[1h]) > 0
        labels: {severity: page}
        annotations: {summary: "Fidelia: the daily SMS budget was reached (SMS pumping, or a real traffic peak): check before raising it"}
      - alert: FideliaSmsDeliveryFailing
        expr: sum(rate(fidelia_auth_events_total{event="otp_request",result="delivery_failed"}[15m])) / sum(rate(fidelia_auth_events_total{event="otp_request"}[15m])) > 0.2
        for: 10m
        labels: {severity: page}
        annotations: {summary: "Fidelia: more than 20% of sign-in SMS fail to send (nobody can sign in)"}
  - name: scolaris-security
    rules:
      - alert: ScolarisMoneyActionsDenied
        # step-up missing, or the auth session already ended: a stolen or stale token trying to cancel a payment or grant a discount
        expr: sum(increase(security_events_total{service="scolaris",event=~"403_(step_up_required|session_ended)"}[15m])) > 10
        labels: {severity: warn}
        annotations: {summary: "Scolaris: repeated denied money actions (cancel / discount) in 15 min"}
      - alert: ScolarisWrongRoleOrApp
        expr: sum(increase(security_events_total{service="scolaris",event=~"403_(wrong_app|forbidden_role|director_only|not_your_evaluation)"}[15m])) > 30
        labels: {severity: warn}
        annotations: {summary: "Scolaris: many role or app denials (someone probing what their account can do)"}
