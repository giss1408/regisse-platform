# Postgres client authentication for the shared infra (mounted by compose.yaml).
# Network connections must use TLS and a password (scram-sha-256); plain TCP is rejected. The unix socket stays "trust" because only someone
# who can already `docker exec` into the container can use it (the infra scripts rely on that, as does the healthcheck).
local   all   all                    trust
hostssl all   all   0.0.0.0/0        scram-sha-256
hostssl all   all   ::/0             scram-sha-256
host    all   all   0.0.0.0/0        reject
host    all   all   ::/0             reject
